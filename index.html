<style>
:root{--bg:#f4f4f4;--acc:#8b5cf6;--on:#0a0a0a}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--acc:#a78bfa;--on:#0a0a0a}}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;min-height:100dvh;display:flex;background:var(--bg);color:#f2f2f2;font:400 17px/1.6 Figtree,system-ui,sans-serif}
::selection{background:var(--acc);color:var(--on)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
h1{margin:0;font:800 clamp(32px,5vw,44px)/1.05 'Bricolage Grotesque',Figtree,sans-serif;letter-spacing:-.02em;color:#f2f2f2}

main{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.card{width:100%;max-width:480px;padding:28px;background:#0a0a0a;border-radius:24px;transition:opacity .28s,transform .28s}
.card.done{opacity:0;transform:scale(.98)}
.logo{display:flex;align-items:center;gap:10px;margin:0 0 34px;font:400 17px/1 'Russo One','Bricolage Grotesque',sans-serif;letter-spacing:.03em;text-transform:uppercase}
.logo svg{width:36px;height:36px;flex:none;margin-left:-5px;fill:var(--acc)}
.lead{color:#9a9a9a;margin:12px 0 24px}
label{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.field{display:flex;align-items:stretch;gap:4px;padding:6px;background:#141414;border:1px solid #ffffff1f;border-radius:14px}
.field:focus-within{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
.field.bad{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
input{flex:1;min-width:0;height:44px;padding:0 12px;border:0;border-radius:9px;background:#0a0a0a;color:#f2f2f2;caret-color:var(--acc);font:500 16px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.08em}
input:focus{outline:none}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px #0a0a0a inset;-webkit-text-fill-color:#f2f2f2;caret-color:var(--acc)}
button{height:44px;border:0;cursor:pointer;white-space:nowrap;font:600 15px Figtree,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#go{min-width:92px;padding:0 20px;border-radius:9px;background:var(--acc);color:var(--on)}
#go:hover{filter:brightness(1.06)}#go:active{filter:brightness(.92)}
#go:disabled{opacity:.6;cursor:progress;filter:none}
.msg{margin:12px 2px 0;font-size:15px}
.msg[hidden]{display:none}
#err{color:#ff6b6b}#caps{color:#9a9a9a}
.meta{margin:26px 0 0;padding:16px 0 0;border-top:1px solid #ffffff1a;display:flex;flex-wrap:wrap;gap:14px 30px}
.meta div{display:flex;flex-direction:column;gap:2px}
.meta dt{font:500 11px/1.2 Figtree,sans-serif;color:#6f6f6f}
.meta dd{margin:0;font:500 12px/1.3 'IBM Plex Mono',ui-monospace,monospace;color:#9a9a9a}

@media(max-width:560px){
main{padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.card{padding:22px 18px}.logo{margin-bottom:28px}
h1{font-size:30px}
.field{flex-wrap:wrap;gap:6px 4px}
#go{flex:1 1 100%;order:3}
.meta{gap:12px 24px}
}
@media(prefers-reduced-motion:reduce){.card{transition:none}.field.bad{animation:none}}

const $ = id => document.getElementById(id);
const f = $('f'), pwd = $('pwd'), err = $('err'), go = $('go'), caps = $('caps'), field = $('field'), card = $('card');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

['keydown', 'keyup'].forEach(t => pwd.addEventListener(t, e => {
  if (e.getModifierState) caps.hidden = !e.getModifierState('CapsLock');
}));
field.addEventListener('animationend', () => field.classList.remove('bad'));

f.addEventListener('submit', async e => {
  e.preventDefault();
  if (!pwd.value) return;
  err.hidden = true;
  go.textContent = 'Decrypting…';
  go.disabled = true;
  try {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pwd.value), {name: 'PBKDF2'}, false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name: 'PBKDF2', salt: b64(salt), iterations: 100000, hash: 'SHA-256'},
      keyMaterial, {name: 'AES-GCM', length: 256}, false, ['decrypt']
    );
    const decrypted = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(iv)}, key, b64(data));
    const html = new TextDecoder().decode(decrypted);
    go.textContent = 'Unlocked';
    card.classList.add('done');
    await new Promise(r => setTimeout(r, still ? 0 : 300));
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    // Short delay so a wrong key doesn't answer instantly.
    setTimeout(() => {
      err.hidden = false;
      field.classList.add('bad');
      go.textContent = 'Unlock';
      go.disabled = false;
      pwd.focus();
      pwd.select();
    }, 750);
  }
});
</script>
