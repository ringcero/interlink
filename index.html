<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Locked page – Interlink</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='48' fill='%230a0a0a'/%3E%3Cpath d='M40%2088h48v80h80v48H40zM88%2040h128v128h-48V88H88z' fill='%23f5f5f5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f4;--card:#fff;--ink:#1a1a1a;--mute:#6a6a6a;--line:#e3e3e3;--acc:#2b22ff;--ok:#2b22ff;--dot:#cdcdcd;--soft:#ebebeb;--hot:#c8102e;--L:max(24px,calc(50vw - 526px));--cur:#6fa0ff;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--wm:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1d1d1d;--ink:#f2f2f2;--mute:#a0a0a0;--line:#2f2f2f;--acc:#7d98ff;--ok:#7d98ff;--cur:#7d98ff;--dot:#3a3a3a;--soft:#262626;--hot:#ff4d5e}}
*,*::before,*::after{box-sizing:border-box}
::selection{background:#2b22ff;color:#fff}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif;overflow-x:hidden}
/* faint page dots */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;--gl:color-mix(in srgb,var(--ink) 8%,transparent);--m0:.55;--m1:1;
background-image:radial-gradient(circle,var(--gl) 1.4px,transparent 1.8px);background-size:28px 28px;background-position:50% 0;
-webkit-mask-image:linear-gradient(135deg,rgba(0,0,0,var(--m0)),rgba(0,0,0,var(--m1))),linear-gradient(90deg,transparent 0,rgba(0,0,0,.5) var(--L),#000 calc(var(--L) + 200px),#000 calc(100% - var(--L) - 200px),rgba(0,0,0,.5) calc(100% - var(--L)),transparent 100%);
-webkit-mask-composite:source-in;
mask-image:linear-gradient(135deg,rgba(0,0,0,var(--m0)),rgba(0,0,0,var(--m1))),linear-gradient(90deg,transparent 0,rgba(0,0,0,.5) var(--L),#000 calc(var(--L) + 200px),#000 calc(100% - var(--L) - 200px),rgba(0,0,0,.5) calc(100% - var(--L)),transparent 100%);
mask-composite:intersect}
@media(prefers-color-scheme:dark){body::before{--gl:color-mix(in srgb,var(--ink) 6%,transparent);--m0:1;--m1:.55}}

/* hero: dot grid behind the card */
.hero{position:relative;overflow:hidden;isolation:isolate;flex:1;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg)}
#hbg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}

/* card */
.stack{width:100%;max-width:480px;transition:opacity .28s,transform .28s}
.stack.done{opacity:0;transform:scale(.98)}
.card{width:100%;padding:28px;background:#0a0a0a;color:#f2f2f2;border-radius:24px 24px 24px 0}
.logo{display:flex;align-items:center;gap:10px;margin:0 0 34px;color:#f2f2f2;font:500 20px/1 var(--wm);letter-spacing:-.03em;text-transform:lowercase}
.logo svg{width:32px;height:32px;flex:none;margin-left:-4px;fill:#f2f2f2}
h1{margin:0;font:700 clamp(28px,4.4vw,40px)/1.12 var(--wm);letter-spacing:-.045em;color:#f2f2f2}
.nw{white-space:nowrap}
.cur{display:inline-block;width:.5em;height:.82em;margin-left:.1em;background:var(--cur);vertical-align:-.04em;animation:curblink 1.1s steps(1,end) infinite}
@keyframes curblink{0%,55%{opacity:1}56%,100%{opacity:0}}
.lead{color:#9a9a9a;margin:12px 0 24px;font-size:16px}

label{display:block;margin:0 0 8px;font:500 12.5px var(--mono);color:#9a9a9a}
.field{display:flex;align-items:stretch;overflow:hidden;background:#1a1a1a;border-radius:12px}
.field.bad{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pr{display:flex;align-items:center;padding-left:16px;font:500 15px var(--mono);color:var(--cur);user-select:none}
input{flex:1;min-width:0;height:52px;padding:0 14px 0 10px;border:0;border-radius:0;background:transparent;color:#f2f2f2;caret-color:var(--cur);font:500 16px var(--mono);letter-spacing:.1em}
input:focus{outline:none}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 100px #1a1a1a inset;-webkit-text-fill-color:#f2f2f2;caret-color:var(--cur)}
button{height:52px;min-width:96px;padding:0 17px;border:5px solid #1a1a1a;border-radius:8px 12px 12px 8px;background-color:#2b22ff;background-clip:padding-box;color:#fff;cursor:pointer;white-space:nowrap;font:600 13px var(--mono);letter-spacing:-.01em;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background-color .15s,color .15s}
button:hover{background-color:#f2f2f2;color:#0a0a0a}
button:active{filter:brightness(.9)}
button:disabled{opacity:.6;cursor:progress}
.msg{margin:12px 2px 0;font:500 12.5px var(--mono)}
.msg[hidden]{display:none}
#err{color:#ff4d5e}#caps{color:#9a9a9a}

.meta{margin:26px 0 0;padding:16px 0 0;border-top:1px solid #ffffff1a;display:flex;flex-wrap:wrap;gap:14px 30px}
.meta div{display:flex;flex-direction:column;gap:2px}
.meta dt{font:500 11px/1.2 var(--mono);color:#6f6f6f}
.meta dd{margin:0;font:500 12px/1.3 var(--mono);color:#9a9a9a}

/* install tab: hangs off the card's bottom-left, joined by a concave curve */
.tab{--r:20px;position:relative;width:fit-content;max-width:calc(100% - 56px);margin-top:-1px;padding:7px 8px 10px;background:#0a0a0a;border-radius:0 0 16px 24px}
.tab::before{content:"";position:absolute;top:0;left:100%;width:var(--r);height:var(--r);background:radial-gradient(circle at 100% 100%,transparent calc(var(--r) - .5px),#0a0a0a var(--r))}
.cmd{display:flex;align-items:center;gap:8px;padding:0 5px 0 14px;background:#1a1a1a;border-radius:12px}
.cmd .pr{display:none}
.cmd code{flex:1;min-width:0;height:42px;display:flex;align-items:center;overflow-x:auto;white-space:nowrap;font:500 12px var(--mono);color:#f2f2f2;user-select:all;scrollbar-width:none}
.cmd code::-webkit-scrollbar{display:none}
.cmd button{height:32px;min-width:56px;padding:0 10px;border:0;border-radius:8px;background-color:#262626;background-clip:border-box;color:#9a9a9a;font:600 12px var(--mono)}
.cmd button:hover{background-color:#f2f2f2;color:#0a0a0a}

@media(max-width:560px){
.hero{padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.card{padding:22px 18px}.logo{margin-bottom:28px}
button{min-width:84px;padding:0 16px}
.meta{gap:12px 24px}
.tab{--r:12px;width:fit-content;max-width:calc(100% - 36px);padding:7px 6px 8px}
.cmd{gap:8px;padding:0 5px 0 12px}
.cmd .pr{display:none}
.cmd code{font-size:10.5px}
.cmd button{min-width:0;padding:0 9px;font-size:11px}
#hbg{-webkit-mask-image:linear-gradient(#000 65%,rgba(0,0,0,.12));mask-image:linear-gradient(#000 65%,rgba(0,0,0,.12))}
}
@media(prefers-reduced-motion:reduce){.cur{animation:none}.card{transition:none}.field.bad{animation:none}}
</style>
</head>
<body>
<main class="hero">
<canvas id="hbg" aria-hidden="true"></canvas>
<div class="stack" id="stack">
<section class="card" id="card" aria-labelledby="t">
<div class="logo"><svg viewBox="0 0 256 256" aria-hidden="true"><path d="M40 88h48v80h80v48H40zM88 40h128v128h-48V88H88z"/></svg>interlink</div>
<h1 id="t">This page is <span class="nw">locked.<i class="cur" aria-hidden="true"></i></span></h1>
<p class="lead">Its content is encrypted. Enter the key to decrypt it in your browser.</p>

<form id="f" autocomplete="off">

<span class="pr" aria-hidden="true">$</span>
<input type="password" id="pwd" autocomplete="off" autocapitalize="off" spellcheck="false" required>
<button type="submit" id="go">Unlock</button>
</div>
<p class="msg" id="caps" hidden>Caps Lock is on.</p>
<p class="msg" id="err" role="alert" hidden>That key didn't work. Check it and try again.</p>
</form>

<dl class="meta">

</dl>

</section>
<div class="tab" role="group" aria-label="Install the CLI">
<div class="cmd">
<span class="pr" aria-hidden="true">$</span>
<code id="cmdtext">curl -sL interlink.sh/cli | bash</code>
<button type="button" id="cp" aria-label="Copy install command">Copy</button>
</div>
</div>
</div>
</main>

const $ = id => document.getElementById(id);
const f = $('f'), pwd = $('pwd'), err = $('err'), go = $('go'), caps = $('caps'), field = $('field'), card = $('stack');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

['keydown', 'keyup'].forEach(t => pwd.addEventListener(t, e => {
  if (e.getModifierState) caps.hidden = !e.getModifierState('CapsLock');
}));
field.addEventListener('animationend', () => field.classList.remove('bad'));

f.addEventListener('submit', async e => {
  e.preventDefault();
  if (!pwd.value) return;
  err.hidden = true;
  go.textContent = 'Decrypting…';
  go.disabled = true;
  try {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pwd.value), {name: 'PBKDF2'}, false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name: 'PBKDF2', salt: b64(salt), iterations: 100000, hash: 'SHA-256'},
      keyMaterial, {name: 'AES-GCM', length: 256}, false, ['decrypt']
    );
    const decrypted = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(iv)}, key, b64(data));
    const html = new TextDecoder().decode(decrypted);
    go.textContent = 'Unlocked';
    card.classList.add('done');
    await new Promise(r => setTimeout(r, still ? 0 : 300));
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    // Short delay so a wrong key doesn't answer instantly.
    setTimeout(() => {
      err.hidden = false;
      field.classList.add('bad');
      go.textContent = 'Unlock';
      go.disabled = false;
      pwd.focus();
      pwd.select();
    }, 750);
  }
});

// Copy the install command.
const cp = $('cp'), cmdtext = $('cmdtext');
cp.addEventListener('click', async () => {
  const text = cmdtext.textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    // Fallback for browsers or contexts without the async clipboard API.
    const r = document.createRange();
    r.selectNodeContents(cmdtext);
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
    try { document.execCommand('copy'); } catch (__) {}

  setTimeout(() => { cp.textContent = 'Copy'; }, 1500);
});
